<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학습 문구 · 쪽집게 영어학원</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-kind="stationery">
  <header id="site-header"></header>
  <main class="container">
    <div class="page-head">
      <h1>학습 문구</h1>
      <p>시험 대비 필기구, 단어장, 바인더까지. 5만원 이상 무료배송 · 학원가 매장 픽업 가능.</p>
    </div>
    <div class="shop-layout">
      <div>
        
        <label class="field"><span>정렬</span>
          <select id="f-sort"><option value="new">최신순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option></select></label>
      </div>
      <div>
        <div class="row" style="margin-bottom:16px">
          <input type="text" id="search" placeholder="검색" style="flex:1">
          <span class="small muted"><b id="count">0</b>개</span>
        </div>
        <div class="grid products" id="products"><p class="muted">불러오는 중…</p></div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/common.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
