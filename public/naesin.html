<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>중계동 영어 내신 문제집 · 중계 영어연구소</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-kind="naesin">
  <header id="site-header"></header>
  <main class="container">
    <div class="page-head">
      <h1>중계동 영어 내신 문제집</h1>
      <p>대진·서라벌·청원·재현·영신 등 중계동 학교별 시험 범위 맞춤 변형문제집 PDF.</p>
    </div>
    <div class="shop-layout">
      <div>
        <label class="field"><span>학교</span><select id="f-school"></select></label><label class="field"><span>학년</span><select id="f-grade"></select></label>
        <label class="field"><span>정렬</span>
          <select id="f-sort"><option value="new">최신순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option></select></label>
      </div>
      <div>
        <div class="row" style="margin-bottom:16px">
          <input type="text" id="search" placeholder="검색" style="flex:1">
          <span class="small muted"><b id="count">0</b>개</span>
        </div>
        <div class="grid products" id="products"><p class="muted">불러오는 중…</p></div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/common.js"></script>
  <script src="js/list.js"></script>
</body>
</html>
