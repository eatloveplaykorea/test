<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>주문조회 · 중계 영어연구소</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container" style="max-width:640px;padding-bottom:48px">
    <div class="page-head">
      <h1>주문조회 · 다운로드</h1>
      <p>주문번호와 주문 시 입력한 연락처로 조회하세요. 입금이 확인되면 문제집 다운로드 버튼이 나타납니다.</p>
    </div>
    <form class="card" id="lookup">
      <label class="field"><span>주문번호</span><input type="text" id="l-no" placeholder="예: 261115-1234" required></label>
      <label class="field"><span>연락처</span><input type="tel" id="l-tel" required></label>
      <button class="btn block">조회하기</button>
    </form>
    <div id="result" style="margin-top:16px"></div>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/common.js"></script>
  <script>
    const { api, esc, won, safeGet, toast } = JG;
    const STATUS = { pending: ['입금 대기', 'orange'], paid: ['입금 확인', 'green'], shipped: ['발송 완료', 'green'], cancelled: ['주문 취소', ''] };
    const last = safeGet('jg_last_order', null);
    if (last) { document.getElementById('l-no').value = last.no; document.getElementById('l-tel').value = last.tel; }
    document.getElementById('lookup').onsubmit = async e => {
      e.preventDefault();
      try {
        const o = await api('/api/orders/lookup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ no: document.getElementById('l-no').value, tel: document.getElementById('l-tel').value }) });
        const [label, cls] = STATUS[o.status] || [o.status, ''];
        const canDownload = o.status === 'paid' || o.status === 'shipped';
        document.getElementById('result').innerHTML = `
          <div class="card">
            <div class="row"><b>주문 ${esc(o.no)}</b><span class="badge ${cls}">${label}</span><span class="spacer"></span><span class="small muted">${new Date(o.createdAt).toLocaleString('ko-KR')}</span></div>
            ${o.items.map(i => `
              <div class="row" style="border-top:1px solid var(--line);padding:10px 0;margin-top:10px">
                <div style="flex:1"><div style="font-weight:700">${esc(i.title)}</div><div class="small muted">${won(i.price)} × ${i.qty}</div></div>
                ${i.kind === 'stationery' ? '<span class="small muted">배송/픽업</span>'
                  : i.download ? `<a class="btn small" href="${esc(i.download)}">⬇ 다운로드</a>` : '<span class="small muted">입금 확인 후 다운로드</span>'}
              </div>`).join('')}
            <div class="row" style="border-top:1px solid var(--line);padding-top:10px"><span>배송비 ${won(o.ship)}</span><span class="spacer"></span><b class="price">${won(o.total)}</b></div>
          </div>`;
      } catch (err) { toast(err.message); document.getElementById('result').innerHTML = ''; }
    };
  </script>
</body>
</html>
