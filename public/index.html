<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>중계 영어연구소 · 모의고사 · 내신 문제집 · 문구</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main>
    <section class="container hero" style="grid-template-columns:1fr">
      <div>
        <span class="badge orange">중계동 학원가 고등 영어</span>
        <h1>중계동 선생님이 만든<br><em>모의고사 · 내신 문제집</em></h1>
        <p>학교별 시험 범위에 맞춘 내신 변형문제집과 실전 모의고사를 PDF로 바로 받아 보세요. 학습 문구도 함께 판매합니다.</p>
        <div class="row">
          <a class="btn" href="naesin.html">내신 문제집 보기</a>
          <a class="btn secondary" href="mock.html">모의고사 보기</a>
          <a class="btn secondary" href="shop.html">문구 쇼핑</a>
        </div>
      </div>
    </section>

    <section class="container" style="padding-bottom:12px">
      <div class="row"><h2 style="margin:0">최신 내신 문제집</h2><span class="spacer"></span><a class="btn ghost small" href="naesin.html">전체보기 →</a></div>
      <div class="grid products" id="home-naesin" style="margin:14px 0 36px"></div>
      <div class="row"><h2 style="margin:0">최신 모의고사</h2><span class="spacer"></span><a class="btn ghost small" href="mock.html">전체보기 →</a></div>
      <div class="grid products" id="home-mock" style="margin:14px 0 36px"></div>
      <div class="row"><h2 style="margin:0">학습 문구</h2><span class="spacer"></span><a class="btn ghost small" href="shop.html">전체보기 →</a></div>
      <div class="grid products" id="home-stationery" style="margin:14px 0 36px"></div>
    </section>

    <section class="strip">
      <div class="container grid steps">
        <div class="step"><b>STEP 1</b>문제집·문구를 장바구니에 담기</div>
        <div class="step"><b>STEP 2</b>주문서 작성 후 무통장 입금</div>
        <div class="step"><b>STEP 3</b>입금 확인 (영업시간 내 바로 처리)</div>
        <div class="step"><b>STEP 4</b>주문조회에서 PDF 다운로드 · 문구는 배송/픽업</div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/common.js"></script>
  <script>
    ['naesin', 'mock', 'stationery'].forEach(k =>
      JG.api('/api/products?kind=' + k).then(list =>
        JG.renderProducts(document.getElementById('home-' + k), list.slice(0, 4), '곧 업로드됩니다!')).catch(() => {}));
  </script>
</body>
</html>
