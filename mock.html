<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>모의고사 만들기 · 중계 영어연구소</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-head no-print">
      <h1>고등 영어 모의고사 만들기</h1>
      <p>학년·유형·문항 수를 고르면 학력평가 형식의 시험지와 정답·해설지를 바로 만들어 인쇄할 수 있습니다.</p>
    </div>

    <div class="builder">
      <aside class="no-print">
        <div class="card">
          <div class="tabs">
            <button class="active" data-tab="setup">시험 설정</button>
            <button data-tab="custom">문항 직접 추가</button>
          </div>

          <form id="setup-form" data-panel="setup">
            <label class="field"><span>시험지 제목</span>
              <input type="text" id="f-title" value="영어 영역 실전 모의고사"></label>
            <label class="field"><span>학교 / 학원명</span>
              <input type="text" id="f-org" value="중계 영어연구소"></label>
            <div class="row">
              <label class="field" style="flex:1"><span>학년</span>
                <select id="f-grade">
                  <option value="0">전체</option>
                  <option value="1">고1</option>
                  <option value="2" selected>고2</option>
                  <option value="3">고3</option>
                </select></label>
              <label class="field" style="flex:1"><span>난이도</span>
                <select id="f-level">
                  <option value="0">혼합</option>
                  <option value="1">기본</option>
                  <option value="2">표준</option>
                  <option value="3">심화</option>
                </select></label>
            </div>
            <div class="field">
              <span class="small" style="font-weight:700;display:block;margin-bottom:6px">출제 유형
                <button type="button" class="btn ghost small" id="toggle-types">전체 선택/해제</button></span>
              <div class="checks" id="type-checks"></div>
            </div>
            <label class="field"><span>최대 문항 수 <b id="count-label">20</b></span>
              <input type="range" id="f-count" min="5" max="45" value="20" style="width:100%"></label>
            <div class="checks" style="margin-bottom:16px">
              <label class="chip"><input type="checkbox" id="f-twocol" checked> 2단 편집</label>
              <label class="chip"><input type="checkbox" id="f-key" checked> 정답·해설 포함</label>
              <label class="chip"><input type="checkbox" id="f-shuffle" checked> 보기 순서 섞기</label>
            </div>
            <button class="btn block" type="submit">시험지 만들기</button>
            <p class="small muted" style="margin:10px 0 0">문항 은행: <b id="bank-size">0</b>문항 (직접 추가한 문항 포함)</p>
          </form>

          <form id="custom-form" data-panel="custom" hidden>
            <p class="small muted" style="margin-top:0">학원 자체 문항을 등록하면 이 브라우저에 저장되어 시험지 생성 시 함께 출제됩니다.</p>
            <label class="field"><span>유형</span><select id="c-type"></select></label>
            <div class="row">
              <label class="field" style="flex:1"><span>학년</span>
                <select id="c-grade"><option value="1">고1</option><option value="2" selected>고2</option><option value="3">고3</option></select></label>
              <label class="field" style="flex:1"><span>난이도</span>
                <select id="c-level"><option value="1">기본</option><option value="2" selected>표준</option><option value="3">심화</option></select></label>
            </div>
            <label class="field"><span>발문</span><input type="text" id="c-stem" placeholder="다음 글의 주제로 가장 적절한 것은?"></label>
            <label class="field"><span>지문 (밑줄은 [[단어]] 로 표시)</span><textarea id="c-passage" style="min-height:140px"></textarea></label>
            <label class="field"><span>보기 5개 (한 줄에 하나)</span><textarea id="c-choices" style="min-height:110px"></textarea></label>
            <div class="row">
              <label class="field" style="flex:1"><span>정답 번호</span>
                <select id="c-answer"><option value="0">①</option><option value="1">②</option><option value="2">③</option><option value="3">④</option><option value="4">⑤</option></select></label>
            </div>
            <label class="field"><span>해설</span><input type="text" id="c-explain"></label>
            <button class="btn block" type="submit">문항 저장</button>
            <div id="custom-list" style="margin-top:14px"></div>
          </form>
        </div>
      </aside>

      <section>
        <div class="row no-print" style="margin-bottom:12px" id="paper-actions" hidden>
          <button class="btn secondary small" id="btn-reshuffle">🔀 다시 출제</button>
          <span class="spacer"></span>
          <button class="btn secondary small" id="btn-print-q">🖨 문제지만 인쇄</button>
          <button class="btn small" id="btn-print">🖨 인쇄 / PDF 저장</button>
        </div>
        <div id="paper-wrap">
          <div class="card empty">
            <div class="big">📝</div>
            <p>왼쪽에서 조건을 고르고 <b>시험지 만들기</b>를 눌러 주세요.</p>
          </div>
        </div>
        <p class="small muted no-print" style="margin-top:10px">문항에 마우스를 올리면 <b>교체</b>·<b>삭제</b> 버튼이 나타납니다.</p>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/common.js"></script>
  <script src="js/bank.js"></script>
  <script src="js/mock.js"></script>
</body>
</html>
