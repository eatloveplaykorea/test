<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내신 문제집 만들기 · 중계 영어연구소</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-head no-print">
      <h1>중계동 영어 내신 문제집 만들기</h1>
      <p>교과서·부교재·모의고사 본문을 붙여 넣으면 학교 내신 유형(빈칸·순서·삽입·어법·어휘·서술형·단어)으로 변형문제를 자동 출제합니다.</p>
    </div>

    <div class="builder">
      <aside class="no-print">
        <form class="card" id="ns-form">
          <div class="row">
            <label class="field" style="flex:1"><span>학교</span>
              <select id="n-school">
                <option>대진고</option><option>대진여고</option><option>서라벌고</option><option>청원고</option>
                <option>청원여고</option><option>재현고</option><option>영신여고</option><option>상계고</option>
                <option>노원고</option><option>불암고</option><option>기타</option>
              </select></label>
            <label class="field" style="flex:1"><span>학년·학기</span>
              <select id="n-term"><option>고1 1학기</option><option>고1 2학기</option><option selected>고2 2학기</option><option>고2 1학기</option><option>고3 1학기</option></select></label>
          </div>
          <label class="field"><span>범위 / 단원명</span><input type="text" id="n-unit" value="Lesson 5 본문"></label>
          <label class="field"><span>영어 본문 (지문 여러 개는 빈 줄로 구분)</span>
            <textarea id="n-text" style="min-height:220px"></textarea></label>
          <button type="button" class="btn ghost small" id="n-sample" style="margin:-6px 0 10px">예시 본문 넣기</button>
          <div class="field">
            <span class="small" style="font-weight:700;display:block;margin-bottom:6px">출제 유형</span>
            <div class="checks" id="n-types"></div>
          </div>
          <label class="field"><span>지문당 세트 수</span>
            <select id="n-sets"><option value="1">1세트</option><option value="2">2세트 (변형 2회)</option><option value="3">3세트</option></select></label>
          <button class="btn block" type="submit">문제집 만들기</button>
        </form>
      </aside>

      <section>
        <div class="row no-print" style="margin-bottom:12px" id="n-actions" hidden>
          <button class="btn secondary small" id="n-regen">🔀 다시 변형</button>
          <span class="spacer"></span>
          <button class="btn secondary small" id="n-print-q">🖨 문제만 인쇄</button>
          <button class="btn small" id="n-print">🖨 인쇄 / PDF 저장</button>
        </div>
        <div id="n-paper">
          <div class="card empty"><div class="big">📚</div><p>본문을 넣고 <b>문제집 만들기</b>를 눌러 주세요.<br><span class="small">처음이라면 <b>예시 본문 넣기</b>로 체험해 보세요.</span></p></div>
        </div>
      </section>
    </div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/common.js"></script>
  <script src="js/naesin.js"></script>
</body>
</html>
