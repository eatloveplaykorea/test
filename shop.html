<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문구 쇼핑 · 중계 영어연구소</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <div class="page-head">
      <h1>학습 문구 쇼핑</h1>
      <p>시험 대비 필기구부터 단어장, 인쇄한 문제집을 묶을 바인더까지. 5만원 이상 무료배송 · 중계동 학원가 당일 픽업 가능</p>
    </div>
    <div class="shop-layout">
      <div>
        <ul class="cat-list" id="cats"></ul>
        <label class="field" style="margin-top:14px"><span>정렬</span>
          <select id="sort"><option value="pop">인기순</option><option value="low">낮은 가격순</option><option value="high">높은 가격순</option></select></label>
      </div>
      <div>
        <input type="text" id="search" placeholder="상품 검색 (예: 형광펜, 단어장)" style="margin-bottom:16px">
        <div class="grid products" id="products"></div>
      </div>
    </div>
  </main>

  <div class="overlay" id="overlay"></div>
  <div class="drawer" id="drawer" aria-label="장바구니">
    <header><h3>장바구니</h3><button class="icon-btn" id="close-drawer">✕</button></header>
    <div class="body" id="cart-body"></div>
    <footer>
      <div class="row small"><span>상품 금액</span><span class="spacer"></span><span id="sum-items">0원</span></div>
      <div class="row small"><span>배송비</span><span class="spacer"></span><span id="sum-ship">0원</span></div>
      <div class="row" style="margin:8px 0 12px"><b>결제 예정 금액</b><span class="spacer"></span><span class="price" id="sum-total">0원</span></div>
      <button class="btn block" id="checkout-btn">주문하기</button>
    </footer>
  </div>

  <div class="modal" id="checkout">
    <form class="card" id="order-form">
      <h3 style="margin-top:0">주문서 작성</h3>
      <label class="field"><span>받는 분</span><input type="text" id="o-name" required></label>
      <label class="field"><span>연락처</span><input type="tel" id="o-tel" placeholder="010-0000-0000" required></label>
      <label class="field"><span>수령 방법</span>
        <select id="o-method"><option value="ship">택배 배송</option><option value="pickup">중계동 학원가 매장 픽업 (배송비 무료)</option></select></label>
      <label class="field" id="addr-field"><span>배송지 주소</span><input type="text" id="o-addr"></label>
      <label class="field"><span>요청사항</span><input type="text" id="o-memo" placeholder="예: 학원 수업 끝나고 7시 이후 픽업"></label>
      <label class="field"><span>결제 수단</span>
        <select id="o-pay"><option>무통장 입금</option><option>매장 결제</option></select></label>
      <p class="small muted">온라인 카드결제는 PG사 연동 후 사용할 수 있습니다. 현재는 주문 접수 후 안내 문자로 결제를 진행합니다.</p>
      <div class="row"><span class="spacer"></span><button type="button" class="btn secondary" id="cancel-order">취소</button><button class="btn" type="submit">주문 접수</button></div>
    </form>
  </div>

  <footer id="site-footer"></footer>
  <script src="js/common.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
